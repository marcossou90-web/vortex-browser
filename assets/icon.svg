<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="vortexBg" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="70%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for Swirling Vortex Blades -->
    <linearGradient id="armCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0062ff"/>
    </linearGradient>

    <linearGradient id="armBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099ff"/>
      <stop offset="60%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="armPurplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <linearGradient id="armPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5f3fc"/>
      <stop offset="80%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Emblem Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#vortexBg)"/>
  
  <!-- Outer Neon Border Ring -->
  <circle cx="256" cy="256" r="234" stroke="url(#armCyanBlue)" stroke-width="4" stroke-opacity="0.85" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="226" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="16 8"/>

  <!-- Swirling Vortex Energy Arms -->
  <g filter="url(#neonGlow)">
    <!-- Arm 1 (Top / Cyan to Blue) -->
    <path d="M 256 50 C 370 50, 440 140, 430 240 C 420 320, 350 370, 290 350 C 240 330, 220 280, 246 256 C 265 240, 290 260, 310 270 C 350 285, 390 250, 390 200 C 390 120, 320 80, 256 80 Z" fill="url(#armCyanBlue)" fill-opacity="0.95"/>

    <!-- Arm 2 (Right / Blue to Purple) -->
    <path d="M 462 256 C 462 370, 372 440, 272 430 C 192 420, 142 350, 162 290 C 182 240, 232 220, 256 246 C 272 265, 252 290, 242 310 C 227 350, 262 390, 312 390 C 392 390, 432 320, 432 256 Z" fill="url(#armBluePurple)" fill-opacity="0.95"/>

    <!-- Arm 3 (Bottom / Purple to Pink) -->
    <path d="M 256 462 C 142 462, 72 372, 82 272 C 92 192, 162 142, 222 162 C 272 182, 292 232, 266 256 C 247 272, 222 252, 202 242 C 162 227, 122 262, 122 312 C 122 392, 192 432, 256 432 Z" fill="url(#armPurplePink)" fill-opacity="0.95"/>

    <!-- Arm 4 (Left / Pink to Cyan) -->
    <path d="M 50 256 C 50 142, 140 72, 240 82 C 320 92, 370 162, 350 222 C 330 272, 280 292, 256 266 C 240 247, 260 222, 270 202 C 285 162, 250 122, 200 122 C 120 122, 80 192, 80 256 Z" fill="url(#armPinkCyan)" fill-opacity="0.95"/>
  </g>

  <!-- Glowing Singularity Center (The Vortex Eye) -->
  <circle cx="256" cy="256" r="64" fill="url(#singularityCore)" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
  <circle cx="256" cy="256" r="16" fill="#00f0ff"/>
</svg>
